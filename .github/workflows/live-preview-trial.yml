name: Live preview foreground trial

# Trial in a fork, not for merging: the live Office suite on GitHub's hosted
# Windows runners with the live preview foreground fix (three runners), and
# main's version of that check on a fourth as the control. Runs only on
# pushes to this trial branch.

"on":
  push:
    branches: [trial/live-preview-foreground]

permissions:
  contents: read

jobs:
  office:
    name: test:office, ${{ matrix.variant }} (${{ matrix.attempt }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: fix, attempt: 1 }
          - { variant: fix, attempt: 2 }
          - { variant: fix, attempt: 3 }
          - { variant: main, attempt: 1 }
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Use main's version of the check
        if: matrix.variant == 'main'
        run: |
          git show HEAD~2:tests/office/livePreview.office.ts | Set-Content -Encoding utf8 tests/office/livePreview.office.ts
          git log -1 --format='%H %s' HEAD~2
          git diff --stat
      - name: Office
        uses: ./.github/actions/office-setup
      - name: Live Office suite
        id: office
        continue-on-error: true
        timeout-minutes: 45
        run: npm run test:office
      - name: The live preview check alone, three times
        id: alone
        continue-on-error: true
        timeout-minutes: 15
        run: |
          $failed = 0
          foreach ($i in 1..3) {
            Write-Host "=== LIVE-PREVIEW-ALONE run $i"
            npx vitest run --config vitest.office.config.ts tests/office/livePreview.office.ts
            if ($LASTEXITCODE) { $failed++ }
          }
          Write-Host "alone: $failed of 3 failed"
          exit $failed
      - name: Outcome of each part
        if: always()
        run: |
          Write-Host "live office: ${{ steps.office.outcome }}"
          Write-Host "alone: ${{ steps.alone.outcome }}"
          if ('${{ steps.office.outcome }}' -ne 'success' -or '${{ steps.alone.outcome }}' -ne 'success') { exit 1 }
