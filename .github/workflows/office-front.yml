name: Office Word-only warm-up trial

# Trial for issue #1489: the complete setup, end to end. One exact Office
# build with Outlook, activation and first-run screens off, then the whole VBE
# oracle corpus, the live Office suite, the integration suite and the editor
# observations. Runs only on pushes to this trial branch, in a fork.

"on":
  push:
    branches: [trial/office-front]

permissions:
  contents: read

jobs:
  suites:
    name: Live Office with a Word-only warm-up (${{ matrix.attempt }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Office
        uses: ./.github/actions/office-setup
      - name: Live Office suite
        id: office
        continue-on-error: true
        timeout-minutes: 45
        run: npm run test:office
      - name: VS Code integration suite
        id: integration
        continue-on-error: true
        timeout-minutes: 45
        run: npm run test:integration
      - name: Measure the editor probes in Office
        id: probes_oracle
        continue-on-error: true
        timeout-minutes: 20
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          node syntax_corpus/oracle/run_vbe_oracle.mjs --cases trial/probe-cases.json --json > test-results/probe-verdicts.json
          $code = $LASTEXITCODE
          node trial/build-manifest.mjs test-results/probe-verdicts.json test-results/probes-manifest.json
          exit $code
      - name: Editor observations
        id: observe
        continue-on-error: true
        timeout-minutes: 30
        shell: pwsh
        env:
          XLIDE_ORACLE_OBSERVATION_MANIFEST: ${{ github.workspace }}\test-results\probes-manifest.json
          XLIDE_ORACLE_OBSERVATION_OUTPUT: ${{ github.workspace }}\test-results\observations.json
        run: |
          npm run test:integration -- --grep "Native oracle compatibility observations"
          $code = $LASTEXITCODE
          if (Test-Path test-results/observations.json) { node trial/summary.mjs test-results/observations.json }
          exit $code
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: suites-results
          path: test-results/
          if-no-files-found: warn
      - name: Outcome of each part
        if: always()
        shell: pwsh
        run: |
          $parts = [ordered]@{ 'live office' = '${{ steps.office.outcome }}'; 'integration' = '${{ steps.integration.outcome }}'; 'probe oracle' = '${{ steps.probes_oracle.outcome }}'; 'observations' = '${{ steps.observe.outcome }}' }
          $parts.GetEnumerator() | ForEach-Object { Write-Host "$($_.Key): $($_.Value)" }
          if ($parts.Values | Where-Object { $_ -ne 'success' }) { exit 1 }

