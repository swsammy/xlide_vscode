name: Office suites trial

# Trial for issue #1489: the VS Code integration suite and the live Office
# suite on a GitHub-hosted Windows runner with Office installed.
# Runs only on pushes to this trial branch, in a fork.

"on":
  push:
    branches: [trial/office-suites]

permissions:
  contents: read

jobs:
  suites:
    name: Integration and live Office suites (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Office, with Outlook for its object library
        shell: pwsh
        run: |
          $config = @"
          <Configuration>
            <Add OfficeClientEdition="64" Channel="MonthlyEnterprise">
              <Product ID="O365ProPlusRetail">
                <Language ID="MatchOS" />
                <ExcludeApp ID="Groove" /><ExcludeApp ID="Lync" /><ExcludeApp ID="OneDrive" /><ExcludeApp ID="OneNote" />
                <ExcludeApp ID="OutlookForWindows" /><ExcludeApp ID="Publisher" /><ExcludeApp ID="Teams" />
              </Product>
            </Add>
            <Display Level="None" AcceptEULA="TRUE" />
          </Configuration>
          "@
          $path = Join-Path $env:RUNNER_TEMP 'odt-config.xml'
          $config | Out-File -FilePath $path -Encoding utf8
          choco install office365proplus -y --params "/ConfigPath:`"$path`""
      - name: Turn off Office's first-run screens
        shell: pwsh
        run: |
          function Set-Dword($key, $name, $value) {
            New-Item -Path $key -Force | Out-Null
            New-ItemProperty -Path $key -Name $name -Value $value -PropertyType DWord -Force | Out-Null
            Write-Host "$key\$name = $value"
          }
          Set-Dword 'HKCU:\Software\Microsoft\Office\16.0\Common\General' 'ShownFirstRunOptin' 1
          Set-Dword 'HKCU:\Software\Microsoft\Office\16.0\Common\General' 'ShownOptIn' 1
          Set-Dword 'HKCU:\Software\Microsoft\Office\16.0\Registration' 'AcceptAllEulas' 1
          Set-Dword 'HKCU:\Software\Microsoft\Office\16.0\Common\Privacy\SettingsStore\Anonymous' 'OptionalConnectedExperiencesNoticeVersion' 2
          Set-Dword 'HKCU:\Software\Microsoft\Office\16.0\Common\Privacy\SettingsStore\Anonymous' 'FRESettingsStoreVersion' 2
          Set-Dword 'HKCU:\Software\Policies\Microsoft\Office\16.0\Common\SignIn' 'SignInOptions' 3
          Set-Dword 'HKCU:\Software\Policies\Microsoft\Office\16.0\Common\General' 'ShownFirstRunOptin' 1
      - name: Prepare Office
        uses: DecimalTurn/setup-vba@797e4a232699a98507cb4411d5bea3697427ad57 # v0.3.0
        with:
          office-apps: Excel,Word,PowerPoint,Access
          install-office: 'false'
      - name: Report the Office version
        shell: pwsh
        run: Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Office\ClickToRun\Configuration' | Select-Object VersionToReport, Platform | Format-List
      - name: VS Code integration suite
        id: integration
        continue-on-error: true
        timeout-minutes: 45
        run: npm run test:integration
      - name: Live Office suite
        id: office
        continue-on-error: true
        timeout-minutes: 60
        run: npm run test:office
      - name: Outcome of each part
        if: always()
        shell: pwsh
        run: |
          Write-Host "integration: ${{ steps.integration.outcome }}"
          Write-Host "live office: ${{ steps.office.outcome }}"
